name: CI

# Every pull request is checked, and develop after a merge: lint, unit and
# integration tests, coverage and builds, gathered by the "test" job that the
# develop ruleset requires. Pushing a release tag (v1.2.3) on develop
# checks it again and deploys it to production.
on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Module files are tidy
        run: go mod tidy -diff
      # The integration tests build only with their tag, so check both.
      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      # Both tools are pinned in go.mod (tool directives) and checked
      # against go.sum; Dependabot proposes updates.
      - name: Staticcheck
        run: go tool staticcheck -tags integration ./...
      - name: Vulnerabilities
        run: go tool govulncheck ./...

  # Each package on its own, with its dependencies faked or in a temporary
  # database.
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          mkdir -p coverage/unit
          go test -race -covermode=atomic -coverpkg="$(go list ./... | grep -v /scripts/ | paste -sd, -)" \
            ./... -args -test.gocoverdir="$PWD/coverage/unit"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: coverage/unit
          retention-days: 7

  # The whole server on a local port, used over SSH like visitors and
  # admins do (integration_test.go).
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          mkdir -p coverage/integration
          go test -race -tags integration -covermode=atomic \
            -coverpkg="$(go list ./... | grep -v /scripts/ | paste -sd, -)" \
            . -args -test.gocoverdir="$PWD/coverage/integration"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: coverage/integration
          retention-days: 7

  # Both kinds of tests together, shown in the run's summary. The run fails
  # if coverage drops below COVERAGE_MIN percent.
  coverage:
    name: coverage
    needs: [unit, integration]
    runs-on: ubuntu-latest
    env:
      COVERAGE_MIN: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage
      - name: Report
        run: |
          dirs=coverage/coverage-unit,coverage/coverage-integration
          go tool covdata textfmt -i="$dirs" -o coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $NF); print $NF}')
          {
            echo "### Coverage: $total%"
            echo
            echo "| Package | Statements covered |"
            echo "|---|---|"
            go tool covdata percent -i="$dirs" |
              awk '{for (i = 2; i <= NF; i++) if ($i == "coverage:") printf "| %s | %s |\n", $(i-1), $(i+1)}'
            echo
            echo "Unit and integration tests together; the minimum is $COVERAGE_MIN%."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "coverage $total% (minimum $COVERAGE_MIN%)"
          awk -v t="$total" -v min="$COVERAGE_MIN" 'BEGIN { exit !(t >= min) }' ||
            { echo "::error::coverage $total% is below $COVERAGE_MIN%"; exit 1; }

  build:
    name: build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath -o sshhub .
      - name: Binary
        run: |
          file sshhub
          ls -l sshhub

  # The one check the develop ruleset requires. It passes only if every job
  # above did: a required check that is skipped counts as passed, so it
  # can't simply need them.
  test:
    name: test
    needs: [lint, unit, integration, coverage, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
      # Set the TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets to
      # get a message when a run fails; without them this step does nothing.
      - name: Notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOKEN" ] || exit 0
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode chat_id="$CHAT" \
            --data-urlencode text="CI failed: $GITHUB_REPOSITORY on $GITHUB_REF_NAME (${GITHUB_SHA::7})
          $RUN_URL"

  deploy:
    name: deploy
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The deploy key is a secret of this environment, which only release tags
    # may use (see deploy/ci-key.sh).
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      # Actions are pinned to commits: a tag can be moved to other code, and
      # this job holds the deploy key. Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Anyone who can push a tag could otherwise deploy any commit, from
      # any branch.
      - name: Tag is on develop
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "::error::$GITHUB_REF_NAME is not on develop; tag a merged commit"
            exit 1
          fi
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # Build from scratch: the cache is shared with the other jobs,
          # which run third-party tools, so it must not feed the release.
          cache: false
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ vars.DEPLOY_GOARCH }} \
            go build -trimpath -ldflags "-X main.release=$GITHUB_REF_NAME" -o sshhub .
      - name: Install on the server
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key can only run sshhub-install, which reads the binary from
          # stdin, restarts the hub and rolls back if it doesn't come up.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "deploy@$HOST" < sshhub
          rm -f ~/.ssh/deploy
      - name: Answers from outside
        run: |
          for _ in $(seq 20); do
            if ssh-keyscan -T 3 -p 23234 "$HOST" 2>/dev/null | grep -q ssh-ed25519; then
              echo "reachable: ssh -p 23234 $HOST"
              exit 0
            fi
            sleep 1
          done
          echo "::error::$HOST:23234 doesn't answer"
          exit 1
      - name: Notify
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOKEN" ] || exit 0
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode chat_id="$CHAT" \
            --data-urlencode text="Deploy $RESULT: $GITHUB_REF_NAME (${GITHUB_SHA::7}) to $HOST
          $RUN_URL"
